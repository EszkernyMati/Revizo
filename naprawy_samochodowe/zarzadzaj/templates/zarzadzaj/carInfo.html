<h1>Szczegóły: {{ auto.marka }} {{ auto.model }}</h1>
<p>Rok produkcji: {{ auto.rok_produkcji }}</p>
<p>VIN: {{ auto.vin }}</p>

<h3>Zaplanowane wizyty:</h3>
<ul>
    {% for n in naprawy %}
        <li>{{ n.data_planowana }} - {{ n.opis }}</li>
    {% empty %}
        <li>Brak zaplanowanych napraw.</li>
    {% endfor %}
</ul>

<a href="{% url 'addVisit' auto.id %}">Dodaj nową naprawę</a>
<br><br>
